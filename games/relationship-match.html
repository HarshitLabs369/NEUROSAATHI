<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Relationship Match - NeuroSaathi</title>


    <!-- NeuroSaathi Performance Tracking -->
    <script src="../js/performance.js"></script>

    <script src="../js/adaptive-engine.js"></script>


    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            color: #17332f;

            background-image:
                url("../assests/bg.png");

            background-repeat:
                no-repeat;

            background-position:
                center center;

            background-size:
                cover;

            background-attachment:
                fixed;

            min-height: 100vh;
        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background:
                rgba(244, 248, 247, 0.16);

            pointer-events: none;

            z-index: 0;
        }


        button {

            border: none;

            cursor: pointer;

            font-family: inherit;
        }


        /* =========================================
           HEADER
        ========================================= */

        header {

            background:
                rgba(23, 51, 47, 0.97);

            color: white;

            padding:
                18px 25px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            position: relative;

            z-index: 10;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.12);
        }


        header h1 {

            margin: 0;

            font-size: 24px;
        }


        .header-buttons {

            display: flex;

            gap: 10px;
        }


        .listen-button,
        .back-button {

            background: white;

            color: #17332f;

            padding:
                12px 18px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .listen-button:hover,
        .back-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 5px 12px
                rgba(0, 0, 0, 0.14);
        }


        .listen-button:active,
        .back-button:active {

            transform:
                translateY(0);
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width:
                min(1050px, 94%);

            margin:
                25px auto 50px;

            position: relative;

            z-index: 1;
        }


        /* =========================================
           INTRO
        ========================================= */

        .intro {

            text-align: center;

            margin-bottom: 25px;

            background:
                rgba(255, 255, 255, 0.90);

            padding: 20px;

            border-radius: 20px;

            box-shadow:
                0 6px 20px
                rgba(0, 0, 0, 0.08);

            backdrop-filter:
                blur(4px);
        }


        .intro h2 {

            margin:
                0 0 8px;

            font-size: 30px;
        }


        .intro p {

            font-size: 18px;

            margin: 5px 0;

            line-height: 1.5;
        }


        /* =========================================
           INSTRUCTIONS
        ========================================= */

        .instruction-box {

            background:
                rgba(255, 255, 255, 0.94);

            padding: 20px;

            border-radius: 18px;

            margin-bottom: 25px;

            text-align: center;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.08);
        }


        #instruction {

            font-size: 20px;

            margin:
                0 0 15px;

            font-weight: bold;

            line-height: 1.5;
        }


        /* =========================================
           STATS
        ========================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            margin-bottom: 25px;
        }


        .stat {

            background:
                rgba(255, 255, 255, 0.94);

            padding: 15px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.07);
        }


        .stat-title {

            font-size: 14px;

            color: #56716c;

            margin-bottom: 5px;
        }


        .stat-value {

            font-size: 24px;

            font-weight: bold;
        }


        /* =========================================
           GAME AREA
        ========================================= */

        .game-area {

            background:
                rgba(255, 255, 255, 0.95);

            border-radius: 25px;

            padding: 30px;

            box-shadow:
                0 8px 28px
                rgba(0, 0, 0, 0.10);
        }


        .game-title {

            text-align: center;

            font-size: 23px;

            font-weight: bold;

            margin-bottom: 25px;
        }


        /* =========================================
           PEOPLE GRID
        ========================================= */

        .relationship-grid {

            display: grid;

            gap: 20px;

            max-width: 750px;

            margin: 0 auto;

            justify-content: center;

            align-items: stretch;
        }


        /* LEVEL 1 */

        .relationship-grid.level-1 {

            grid-template-columns:
                repeat(2, 1fr);
        }


        /* LEVEL 2 */

        .relationship-grid.level-2 {

            grid-template-columns:
                repeat(3, 1fr);
        }


        /* LEVEL 3 */

        .relationship-grid.level-3 {

            grid-template-columns:
                repeat(2, 1fr);
        }


        /* LEVEL 4 */

        .relationship-grid.level-4 {

            grid-template-columns:
                repeat(3, 1fr);
        }


        /* =========================================
           PERSON CARD
        ========================================= */

        .person-card {

            min-height: 230px;

            background:
                rgba(244, 250, 248, 0.97);

            border:
                3px solid #c4dfd9;

            border-radius: 20px;

            padding: 18px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            cursor: pointer;

            overflow: hidden;

            user-select: none;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .person-card:hover {

            transform:
                translateY(-3px);

            border-color:
                #237c70;

            box-shadow:
                0 8px 18px
                rgba(35, 124, 112, 0.14);
        }


        .person-card.selected {

            border-color:
                #237c70;

            background:
                #e1f2ee;

            transform:
                scale(1.02);

            box-shadow:
                0 7px 18px
                rgba(35, 124, 112, 0.15);
        }


        .person-card.correct {

            border-color:
                #237c70;

            background:
                #dff3ec;
        }


        .person-card.wrong {

            border-color:
                #b34a3a;

            background:
                #f9e5e1;
        }


        /* =========================================
           FULL PHOTO CARD
           
           IMPORTANT:
           When a caregiver photo exists,
           the image fills the entire card.
           
           No name or hint is displayed.
        ========================================= */

        .person-card.image-card {

            padding: 0;
        }


        .person-card.image-card
        .person-image-wrapper {

            width: 100%;

            height: 100%;

            min-height: 230px;

            margin: 0;

            border: none;

            border-radius: 17px;

            background:
                #d9ebe7;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            flex: 1;
        }


        .person-card.image-card
        .person-image {

            width: 100%;

            height: 100%;

            min-height: 230px;

            object-fit: cover;

            display: block;
        }


        /* =========================================
           CAREGIVER PHOTO
           
           This remains unchanged for fallback
           compatibility, but image-card overrides
           it when an actual photo exists.
        ========================================= */

        .person-image-wrapper {

            width: 105px;

            height: 105px;

            border-radius: 50%;

            overflow: hidden;

            background:
                #d9ebe7;

            border:
                3px solid #237c70;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 12px;

            flex-shrink: 0;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.08);
        }


        .person-image {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* =========================================
           FALLBACK PERSON ICON
        ========================================= */

        .person-icon {

            width: 105px;

            height: 105px;

            border-radius: 50%;

            background:
                #d9ebe7;

            border:
                3px solid #237c70;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 12px;

            font-size: 22px;

            font-weight: bold;

            color: #17332f;

            flex-shrink: 0;
        }


        .person-name {

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 5px;

            color: #17332f;
        }


        .person-hint {

            font-size: 15px;

            color: #617772;
        }


        /* =========================================
           RELATIONSHIP OPTIONS
        ========================================= */

        .relationship-title {

            text-align: center;

            font-size: 20px;

            font-weight: bold;

            margin:
                30px 0 18px;
        }


        .relationship-options {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(200px, 1fr));

            gap: 15px;

            max-width: 750px;

            margin: 0 auto;
        }


        .relationship-button {

            background:
                rgba(255, 255, 255, 0.97);

            border:
                3px solid #9fc8c0;

            border-radius: 15px;

            padding: 17px;

            font-size: 18px;

            font-weight: bold;

            color: #17332f;

            min-height: 65px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .relationship-button:hover {

            transform:
                translateY(-2px);

            border-color:
                #237c70;

            background:
                #eef8f5;

            box-shadow:
                0 5px 12px
                rgba(0, 0, 0, 0.08);
        }


        .relationship-button.selected {

            background:
                #e1f2ee;

            border-color:
                #237c70;
        }


        .relationship-button.wrong {

            background:
                #f9e5e1;

            border-color:
                #b34a3a;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {

            text-align: center;

            margin-top: 25px;

            min-height: 30px;

            font-size: 20px;

            font-weight: bold;

            line-height: 1.4;
        }


        .success {

            color:
                #237c70;
        }


        .error {

            color:
                #b34a3a;
        }


        /* =========================================
           CONTROLS
        ========================================= */

        .controls {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 30px;
        }


        .control-button {

            padding:
                14px 22px;

            border-radius: 12px;

            background:
                #237c70;

            color: white;

            font-size: 17px;

            font-weight: bold;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .control-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 6px 14px
                rgba(0, 0, 0, 0.12);
        }


        .control-button:active {

            transform:
                translateY(0);
        }


        .secondary-button {

            background:
                #17332f;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            body {

                background-attachment:
                    scroll;
            }


            header {

                flex-direction:
                    column;

                text-align: center;

                padding: 15px;
            }


            header h1 {

                font-size: 21px;
            }


            .header-buttons {

                width: 100%;

                justify-content:
                    center;
            }


            .listen-button,
            .back-button {

                padding:
                    10px 13px;

                font-size: 14px;
            }


            .container {

                width: 94%;

                margin-top: 18px;
            }


            .intro {

                padding: 17px;
            }


            .intro h2 {

                font-size: 25px;
            }


            .intro p {

                font-size: 16px;
            }


            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .stat {

                padding: 13px;
            }


            .stat-value {

                font-size: 21px;
            }


            .game-area {

                padding: 20px;

                border-radius: 20px;
            }


            /*
               Keep people cards easy
               to use on small screens.
            */

            .relationship-grid.level-1,
            .relationship-grid.level-2,
            .relationship-grid.level-3,
            .relationship-grid.level-4 {

                grid-template-columns:
                    1fr;
            }


            .relationship-options {

                grid-template-columns:
                    1fr;
            }


            .person-card {

                min-height: 205px;

                padding: 18px;
            }


            /* Full photo on mobile too */

            .person-card.image-card {

                padding: 0;
            }


            .person-card.image-card
            .person-image-wrapper {

                min-height: 205px;

                border-radius: 17px;
            }


            .person-card.image-card
            .person-image {

                min-height: 205px;
            }


            .person-image-wrapper {

                width: 90px;

                height: 90px;
            }


            .person-icon {

                width: 90px;

                height: 90px;
            }


            .person-name {

                font-size: 19px;
            }


            .relationship-button {

                min-height: 60px;

                font-size: 17px;
            }

        }


        /* =========================================
           VERY SMALL PHONES
        ========================================= */

        @media (max-width: 400px) {

            .stats {

                gap: 8px;
            }


            .stat-title {

                font-size: 12px;
            }


            .stat-value {

                font-size: 19px;
            }


            .game-area {

                padding: 15px;
            }


            .person-card {

                min-height: 195px;
            }


            .person-card.image-card
            .person-image-wrapper {

                min-height: 195px;
            }


            .person-card.image-card
            .person-image {

                min-height: 195px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <h1>
        NeuroSaathi
    </h1>


    <div class="header-buttons">

        <button
            class="listen-button"
            id="listenButton"
        >
            🔊 Listen
        </button>


        <button
            class="back-button"
            onclick="goBack()"
        >
            Back
        </button>

    </div>

</header>



<!-- =========================================
     MAIN
========================================= -->

<div class="container">


    <!-- INTRO -->

    <div class="intro">

        <h2>
            Relationship Match
        </h2>


        <p>
            Match each person with the correct relationship.
        </p>

    </div>



    <!-- INSTRUCTIONS -->

    <div class="instruction-box">

        <p id="instruction">

            Select a person and then choose
            the relationship that matches them.

        </p>


        <button
            class="listen-button"
            id="instructionListen"
        >

            🔊 Listen to Instructions

        </button>

    </div>



    <!-- =========================================
         STATS
    ========================================= -->

    <div class="stats">


        <div class="stat">

            <div class="stat-title">
                Level
            </div>


            <div
                class="stat-value"
                id="levelDisplay"
            >
                1
            </div>

        </div>



        <div class="stat">

            <div class="stat-title">
                People
            </div>


            <div
                class="stat-value"
                id="peopleDisplay"
            >
                2
            </div>

        </div>



        <div class="stat">

            <div class="stat-title">
                Correct
            </div>


            <div
                class="stat-value"
                id="correctDisplay"
            >
                0
            </div>

        </div>



        <div class="stat">

            <div class="stat-title">
                Accuracy
            </div>


            <div
                class="stat-value"
                id="accuracyDisplay"
            >
                0%
            </div>

        </div>

    </div>



    <!-- =========================================
         GAME
    ========================================= -->

    <section class="game-area">


        <div class="game-title">

            Who is this person?

        </div>



        <div
            class="relationship-grid"
            id="relationshipGrid"
        >
        </div>



        <div class="relationship-title">

            Choose the Relationship

        </div>



        <div
            class="relationship-options"
            id="relationshipOptions"
        >
        </div>



        <div
            class="message"
            id="message"
        >
        </div>



        <div class="controls">


            <button
                class="control-button"
                id="nextButton"
            >
                Next
            </button>


            <button
                class="control-button secondary-button"
                id="restartButton"
            >
                Restart
            </button>

        </div>

    </section>

</div>



<script>


    /* =========================================
       RELATIONSHIP DATA
    ========================================= */

    const relationshipData = [

        {
            name: "Mother",
            relationship: "Mother"
        },

        {
            name: "Father",
            relationship: "Father"
        },

        {
            name: "Son",
            relationship: "Son"
        },

        {
            name: "Daughter",
            relationship: "Daughter"
        },

        {
            name: "Brother",
            relationship: "Brother"
        },

        {
            name: "Sister",
            relationship: "Sister"
        },

        {
            name: "Grandson",
            relationship: "Grandson"
        },

        {
            name: "Granddaughter",
            relationship: "Granddaughter"
        },

        {
            name: "Friend",
            relationship: "Friend"
        },

        {
            name: "Grandfather",
            relationship: "Grandfather"
        },

        {
            name: "Grandmother",
            relationship: "Grandmother"
        },

        {
            name: "Caregiver",
            relationship: "Caregiver"
        }

    ];



    /* =========================================
       DIFFICULTY
    ========================================= */

    const difficultyLevels = {

        1: {
            people: 2
        },

        2: {
            people: 3
        },

        3: {
            people: 4
        },

        4: {
            people: 6
        }

    };



    /* =========================================
       GAME STATE
    ========================================= */

    let currentLevel = 1;

    let currentPeople = [];

    let selectedPerson = null;

    let correctCount = 0;

    let attempts = 0;

    let levelStartTime = 0;

    let performanceSaved = false;



    /* =========================================
       RELATIONSHIP PHOTO STORAGE
       
       Caregiver settings/dashboard stores
       photos under:

       neurosaathi_relationship_images
    ========================================= */

    const RELATIONSHIP_IMAGE_KEY =
        "neurosaathi_relationship_images";


    let relationshipImages = {};



    /* =========================================
       LOAD CAREGIVER PHOTOS
    ========================================= */

    function loadRelationshipImages() {

        relationshipImages = {};


        try {

            const stored =
                localStorage.getItem(
                    RELATIONSHIP_IMAGE_KEY
                );


            if (!stored) {

                return;

            }


            const parsed =
                JSON.parse(stored);


            /*
             * Standard NeuroSaathi format:
             *
             * {
             *     "Mother": "data:image/...",
             *     "Father": "data:image/...",
             *     ...
             * }
             */

            if (
                parsed &&
                typeof parsed === "object" &&
                !Array.isArray(parsed)
            ) {

                Object.keys(parsed).forEach(
                    key => {

                        const value =
                            parsed[key];


                        /*
                         * Normal string format.
                         */

                        if (
                            typeof value ===
                            "string"
                        ) {

                            relationshipImages[key] =
                                value;

                            return;

                        }


                        /*
                         * Also support an object
                         * containing image/data/url.
                         */

                        if (
                            value &&
                            typeof value ===
                            "object"
                        ) {

                            if (
                                typeof value.image ===
                                "string"
                            ) {

                                relationshipImages[key] =
                                    value.image;

                            }

                            else if (
                                typeof value.data ===
                                "string"
                            ) {

                                relationshipImages[key] =
                                    value.data;

                            }

                            else if (
                                typeof value.url ===
                                "string"
                            ) {

                                relationshipImages[key] =
                                    value.url;

                            }

                        }

                    }
                );

            }


            /*
             * Also support array-based storage
             * in case caregiver settings uses it.
             */

            if (
                Array.isArray(parsed)
            ) {

                parsed.forEach(
                    item => {

                        if (
                            !item ||
                            typeof item !==
                            "object"
                        ) {

                            return;

                        }


                        const name =
                            item.name ||
                            item.relationship;


                        const image =
                            item.image ||
                            item.data ||
                            item.url;


                        if (
                            name &&
                            typeof image ===
                            "string"
                        ) {

                            relationshipImages[name] =
                                image;

                        }

                    }
                );

            }

        }

        catch (error) {

            console.log(
                "Relationship images could not be loaded."
            );

            relationshipImages = {};

        }

    }



    /* =========================================
       GET PERSON IMAGE
    ========================================= */

    function getRelationshipImage(
        personName
    ) {

        if (
            relationshipImages[
                personName
            ]
        ) {

            return relationshipImages[
                personName
            ];

        }


        return null;

    }



    /* =========================================
       DOM ELEMENTS
    ========================================= */

    const relationshipGrid =
        document.getElementById(
            "relationshipGrid"
        );


    const relationshipOptions =
        document.getElementById(
            "relationshipOptions"
        );


    const levelDisplay =
        document.getElementById(
            "levelDisplay"
        );


    const peopleDisplay =
        document.getElementById(
            "peopleDisplay"
        );


    const correctDisplay =
        document.getElementById(
            "correctDisplay"
        );


    const accuracyDisplay =
        document.getElementById(
            "accuracyDisplay"
        );


    const message =
        document.getElementById(
            "message"
        );



    /* =========================================
       SHUFFLE
    ========================================= */

    function shuffle(array) {

        const copy =
            [...array];


        for (
            let i = copy.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );


            [
                copy[i],
                copy[j]
            ] =
            [
                copy[j],
                copy[i]
            ];

        }


        return copy;

    }



    /* =========================================
       START LEVEL
    ========================================= */

    function startLevel(level) {

        currentLevel =
            level;

        correctCount =
            0;

        attempts =
            0;

        selectedPerson =
            null;


        levelStartTime =
            Date.now();

        performanceSaved =
            false;


        message.textContent =
            "";

        message.className =
            "message";


        /*
         * Reload caregiver photos every
         * time a level starts.
         *
         * This allows newly uploaded
         * photos to appear without
         * changing the game logic.
         */

        loadRelationshipImages();


        const settings =
            difficultyLevels[
                level
            ];


        currentPeople =
            shuffle(
                relationshipData
            ).slice(
                0,
                settings.people
            );


        updateStats();

        renderPeople();

        renderRelationships();

    }



    /* =========================================
       RENDER PEOPLE
    ========================================= */

    function renderPeople() {

        relationshipGrid.innerHTML =
            "";


        relationshipGrid.className =
            "relationship-grid level-" +
            currentLevel;


        currentPeople.forEach(
            (person, index) => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "person-card";


                card.dataset.index =
                    index;


                const image =
                    getRelationshipImage(
                        person.name
                    );


                /*
                 * Caregiver photo available.
                 *
                 * PHOTO ONLY:
                 * The relationship name and
                 * hint are deliberately not
                 * displayed.
                 */

                if (image) {

                    card.classList.add(
                        "image-card"
                    );


                    card.innerHTML = `

                        <div
                            class="person-image-wrapper"
                        >

                            <img
                                class="person-image"
                                src="${image}"
                                alt=""
                                loading="lazy"
                            >

                        </div>

                    `;

                }


                /*
                 * No caregiver photo.
                 *
                 * Keep the existing numbered
                 * fallback instead of
                 * breaking the game.
                 */

                else {

                    card.innerHTML = `

                        <div
                            class="person-icon"
                        >
                            ${index + 1}
                        </div>


                        <div
                            class="person-name"
                        >
                            ${person.name}
                        </div>


                        <div
                            class="person-hint"
                        >
                            Select this person
                        </div>

                    `;

                }


                card.addEventListener(
                    "click",
                    () => {

                        selectPerson(
                            index,
                            card
                        );

                    }
                );


                relationshipGrid.appendChild(
                    card
                );

            }
        );

    }



    /* =========================================
       SELECT PERSON
    ========================================= */

    function selectPerson(
        index,
        card
    ) {

        selectedPerson =
            index;


        document
            .querySelectorAll(
                ".person-card"
            )
            .forEach(
                element => {

                    element.classList.remove(
                        "selected"
                    );

                }
            );


        card.classList.add(
            "selected"
        );


        message.textContent =
            "Now choose the correct relationship.";


        message.className =
            "message";

    }



    /* =========================================
       RENDER RELATIONSHIPS
    ========================================= */

    function renderRelationships() {

        relationshipOptions.innerHTML =
            "";


        const relationships =
            shuffle(
                currentPeople.map(
                    person =>
                        person.relationship
                )
            );


        relationships.forEach(
            relationship => {


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "relationship-button";


                button.textContent =
                    relationship;


                button.addEventListener(
                    "click",
                    () => {

                        checkAnswer(
                            relationship,
                            button
                        );

                    }
                );


                relationshipOptions.appendChild(
                    button
                );

            }
        );

    }



    /* =========================================
       CHECK ANSWER
    ========================================= */

    function checkAnswer(
        relationship,
        button
    ) {

        if (
            selectedPerson ===
            null
        ) {

            message.textContent =
                "Please select a person first.";


            message.className =
                "message error";


            return;

        }


        const person =
            currentPeople[
                selectedPerson
            ];


        attempts++;


        if (
            relationship ===
            person.relationship
        ) {

            correctCount++;


            button.classList.add(
                "selected"
            );


            document
                .querySelectorAll(
                    ".person-card"
                )
                [
                    selectedPerson
                ]
                .classList.add(
                    "correct"
                );


            message.textContent =
                "Correct. Well done.";


            message.className =
                "message success";


            updateStats();


            selectedPerson =
                null;


            checkCompletion();

        }

        else {

            button.classList.add(
                "wrong"
            );


            message.textContent =
                "That relationship is not correct. Try again.";


            message.className =
                "message error";


            setTimeout(
                () => {

                    button.classList.remove(
                        "wrong"
                    );

                },
                700
            );


            updateStats();

        }

    }



    /* =========================================
       SOOTHING COMPLETION SOUND
    ========================================= */

    function playSuccessSound() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContext) {

                return;

            }


            const audioContext =
                new AudioContext();


            const now =
                audioContext.currentTime;


            const notes = [

                {
                    frequency: 523.25,
                    start: 0,
                    duration: 0.18
                },

                {
                    frequency: 659.25,
                    start: 0.16,
                    duration: 0.18
                },

                {
                    frequency: 783.99,
                    start: 0.32,
                    duration: 0.30
                }

            ];


            notes.forEach(
                note => {

                    const oscillator =
                        audioContext
                            .createOscillator();


                    const gain =
                        audioContext
                            .createGain();


                    oscillator.type =
                        "sine";


                    oscillator.frequency.value =
                        note.frequency;


                    gain.gain.setValueAtTime(
                        0.0001,
                        now +
                        note.start
                    );


                    gain.gain
                        .exponentialRampToValueAtTime(
                            0.18,
                            now +
                            note.start +
                            0.03
                        );


                    gain.gain
                        .exponentialRampToValueAtTime(
                            0.0001,
                            now +
                            note.start +
                            note.duration
                        );


                    oscillator.connect(
                        gain
                    );


                    gain.connect(
                        audioContext.destination
                    );


                    oscillator.start(
                        now +
                        note.start
                    );


                    oscillator.stop(
                        now +
                        note.start +
                        note.duration
                    );

                }
            );


            setTimeout(
                () => {

                    audioContext.close();

                },
                1000
            );

        }

        catch (error) {

            console.log(
                "Sound could not be played."
            );

        }

    }



    /* =========================================
       SAVE PERFORMANCE DATA
    ========================================= */

    function savePerformanceData() {

        if (
            performanceSaved
        ) {

            return;

        }


        performanceSaved =
            true;


        const accuracy =
            attempts === 0
                ? 0
                : Math.round(
                    (
                        correctCount /
                        attempts
                    ) * 100
                );


        const mistakes =
            attempts -
            correctCount;


        const completionTime =
            Math.round(
                (
                    Date.now() -
                    levelStartTime
                ) / 1000
            );


        if (
            typeof NeuroSaathiPerformance !==
            "undefined"
        ) {

            NeuroSaathiPerformance
                .saveGameSession({

                    game:
                        "relationship-match",

                    level:
                        currentLevel,

                    accuracy:
                        accuracy,

                    attempts:
                        attempts,

                    correct:
                        correctCount,

                    mistakes:
                        mistakes,

                    completionTime:
                        completionTime,

                    completed:
                        true

                });

        }

        else {

            console.log(
                "Performance tracking system not found."
            );

        }

    }



    /* =========================================
       COMPLETION
    ========================================= */

    function checkCompletion() {

        if (
            correctCount !==
            currentPeople.length
        ) {

            return;

        }


        const accuracy =
            attempts === 0
                ? 0
                : Math.round(
                    (
                        correctCount /
                        attempts
                    ) * 100
                );


        savePerformanceData();


        playSuccessSound();


        message.textContent =
            "You matched everyone correctly.";


        message.className =
            "message success";


        if (
            accuracy >= 85 &&
            currentLevel < 4
        ) {

            setTimeout(
                () => {

                    message.textContent =
                        "Excellent performance. You are ready for the next level.";

                },
                700
            );

        }

    }



    /* =========================================
       UPDATE STATS
    ========================================= */

    function updateStats() {

        levelDisplay.textContent =
            currentLevel;


        peopleDisplay.textContent =
            currentPeople.length;


        correctDisplay.textContent =
            correctCount;


        const accuracy =
            attempts === 0
                ? 0
                : Math.round(
                    (
                        correctCount /
                        attempts
                    ) * 100
                );


        accuracyDisplay.textContent =
            accuracy +
            "%";

    }



    /* =========================================
       NEXT LEVEL
    ========================================= */

    document
        .getElementById(
            "nextButton"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    currentLevel < 4
                ) {

                    startLevel(
                        currentLevel + 1
                    );

                }

                else {

                    message.textContent =
                        "You have completed all four levels.";


                    message.className =
                        "message success";

                }

            }
        );



    /* =========================================
       RESTART
    ========================================= */

    document
        .getElementById(
            "restartButton"
        )
        .addEventListener(
            "click",
            () => {

                startLevel(
                    currentLevel
                );

            }
        );



    /* =========================================
       VOICE ASSISTANCE
    ========================================= */

    function speakInstruction() {

        if (
            !(
                "speechSynthesis"
                in
                window
            )
        ) {

            alert(
                "Voice assistance is not supported in this browser."
            );

            return;

        }


        window.speechSynthesis.cancel();


        const text =
            document.getElementById(
                "instruction"
            ).textContent;


        const speech =
            new SpeechSynthesisUtterance(
                text
            );


        speech.lang =
            "en-IN";


        speech.rate =
            0.85;


        speech.pitch =
            1;


        window.speechSynthesis.speak(
            speech
        );

    }



    document
        .getElementById(
            "listenButton"
        )
        .addEventListener(
            "click",
            speakInstruction
        );



    document
        .getElementById(
            "instructionListen"
        )
        .addEventListener(
            "click",
            speakInstruction
        );



    /* =========================================
       BACK
    ========================================= */

    function goBack() {

        window.location.href =
            "../index.html";

    }



    /* =========================================
       ESCAPE
    ========================================= */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Escape"
            ) {

                if (
                    "speechSynthesis"
                    in
                    window
                ) {

                    window.speechSynthesis.cancel();

                }

            }

        }
    );



    /* =========================================
       START GAME
    ========================================= */

    let recommendedLevel = 1;


    if (
        typeof NeuroSaathiAdaptiveEngine !==
        "undefined"
    ) {

        recommendedLevel =
            NeuroSaathiAdaptiveEngine
                .getRecommendedLevel(
                    "relationship-match"
                );

    }


    currentLevel =
        recommendedLevel ||
        1;


    startLevel(
        currentLevel
    );

</script>
